<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MovingLLM 装车整理</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #e4dcd2;
      --paper: #f6f1ea;
      --panel: #fffdf9;
      --accent: #9a5b32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header, .links { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; }
    header { padding: 20px 24px 12px; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    header p, .links a { color: var(--muted); font-size: 14px; }
    header p { margin: 6px 0 0; max-width: 720px; }
    .links { align-items: center; gap: 12px; }
    .links a { color: var(--accent); text-decoration: none; }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 0 24px 24px;
    }
    .panel, .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="number"] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
    .dims { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .row, .links-inline { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font: inherit;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--ink);
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #efe8df; color: var(--ink); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { min-height: 20px; font-size: 13px; color: var(--accent); }
    ul.items { list-style: none; margin: 0; padding: 0; overflow: auto; max-height: 320px; }
    ul.items li { border-top: 1px solid var(--line); padding: 8px 4px; cursor: pointer; font-size: 13px; }
    ul.items li.active { background: #f3ebe3; border-radius: 8px; }
    ul.items small, .hint { display: block; color: var(--muted); }
    h2 { margin: 4px 0 0; font-size: 14px; }
    .stage { position: relative; height: calc(100vh - 140px); min-height: 520px; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    .hud {
      position: absolute; left: 16px; right: 16px; bottom: 14px;
      color: #6b645c; font-size: 12px; pointer-events: none;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .stage { order: -1; height: 68vh; min-height: 420px; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "/assets/vendor/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <div>
      <h1>装车整理</h1>
      <p>输入车厢的长、宽、高，生成一节可以堆叠的三维空间。拖动鼠标移动物体，松手后落到有支撑的高度。</p>
    </div>
    <nav class="links">
      <a href="/studio">入口</a>
      <a href="/home">新家摆放</a>
      <a href="/view">自动报价</a>
    </nav>
  </header>
  <div class="layout">
    <aside class="panel">
      <div class="dims">
        <div>
          <label for="length">长 cm</label>
          <input id="length" type="number" min="40" max="2000" value="420" />
        </div>
        <div>
          <label for="width">宽 cm</label>
          <input id="width" type="number" min="40" max="2000" value="200" />
        </div>
        <div>
          <label for="height">高 cm</label>
          <input id="height" type="number" min="40" max="2000" value="200" />
        </div>
      </div>
      <div class="row">
        <button id="build" type="button">生成车厢</button>
        <button id="rotate" class="secondary" type="button">旋转 90°</button>
        <button id="frame" class="secondary" type="button">复位视角</button>
      </div>
      <div class="status" id="status"></div>
      <p class="hint">空白处拖动可转视角，滚轮缩放。车厢左侧是待装物品。按 R 旋转选中的物品。</p>
      <h2>车厢内</h2>
      <ul class="items" id="placed"></ul>
      <h2>待装</h2>
      <ul class="items" id="held"></ul>
    </aside>
    <section class="stage">
      <canvas id="scene"></canvas>
      <div class="hud">x 从左到右，y 从地板向上，z 从后部指向车门。橙色框是车门。</div>
    </section>
  </div>
  <script type="module">
    import { createSpace } from "/assets/space.js";

    const sampleItems = [
      { name: "衣柜", furniture_type: "wardrobe", dimensions: { length: 180, width: 60, height: 200 }, weight: 70, quantity: 1 },
      { name: "沙发", furniture_type: "sofa", dimensions: { length: 200, width: 90, height: 85 }, weight: 40, quantity: 1 },
      { name: "床垫", furniture_type: "bed", dimensions: { length: 200, width: 150, height: 20 }, weight: 18, quantity: 1 },
      { name: "纸箱杂物", furniture_type: "drawer", dimensions: { length: 40, width: 30, height: 20 }, weight: 4, quantity: 2 },
      { name: "穿衣镜", furniture_type: "other", dimensions: { length: 50, width: 40, height: 8 }, weight: 8, fragile: true, quantity: 1 }
    ];
    let furnitureItems = [];
    let editingId = null;
    function makeEntry(values) {
      return {
        ...values,
        clientId: crypto.randomUUID()
      };
    }
    function toApiItem(entry) {
      const { clientId, ...item } = entry;
      return item;
    }
    function validateFurniture(raw) {
      const name = String(raw.name ?? "").trim();
      if (!name) throw new Error("请输入物品名称");

      const positive = (value, label) => {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) {
          throw new Error(`${label}必须是大于零的数字`);
        }
        return number;
      };

      const quantity = positive(raw.quantity, "数量");
      if (!Number.isInteger(quantity)) {
        throw new Error("数量必须是整数");
      }

      return {
        name,
        furniture_type: raw.furniture_type || "other",
        dimensions: {
          length: positive(raw.length, "长度"),
          width: positive(raw.width, "宽度"),
          height: positive(raw.height, "高度")
        },
        quantity
      };
    }
    const sideText = { left: "左侧", center: "中间", right: "右侧" };
    const levelText = { bottom: "底层", middle: "中层", top: "上层" };

    let layout = null;
    let busy = false;
    const status = document.getElementById("status");
    const space = createSpace(document.getElementById("scene"), {
      onCommit: (move) => commit(move),
      onSelect: (item) => mark(item && item.id)
    });

    async function build() {
      const spaceSize = {
        length_cm: Number(document.getElementById("length").value),
        width_cm: Number(document.getElementById("width").value),
        height_cm: Number(document.getElementById("height").value)
      };
      await run("正在放入示例家具", async () => {
        const response = await fetch("/cargo/arrange", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ furniture_items: sampleItems, space: spaceSize })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(errorText(body));
        apply(body);
        status.textContent = body.held.length
          ? `已生成车厢。还有 ${body.held.length} 件待装，拖进车厢即可。`
          : "已生成车厢。拖动物体可以重新堆叠。";
      });
    }

    async function commit(move) {
      if (!layout || busy) {
        if (layout) space.showCargo(layout);
        return;
      }
      const held = (layout.held || []).some((item) => item.id === move.id);
      if (move.intent === "rotate" && held) {
        status.textContent = "先把这件拖进车厢，再旋转。";
        space.showCargo(layout);
        return;
      }
      const payload = {
        id: move.id,
        x_cm: move.x_cm,
        z_cm: move.z_cm,
        yaw_quarters: move.yaw_quarters
      };
      await run("正在核对落点", async () => {
        const response = await fetch("/cargo/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ layout, move: payload })
        });
        const body = await response.json();
        if (!response.ok) {
          space.showCargo(layout);
          throw new Error(errorText(body));
        }
        apply(body);
        const item = body.placements.find((piece) => piece.id === move.id);
        status.textContent = item ? item.note : "已更新位置。";
        mark(move.id);
      });
    }

    function apply(next) {
      layout = next;
      space.showCargo(layout);
      fill(document.getElementById("placed"), layout.placements, "车厢里还没有物品");
      fill(document.getElementById("held"), layout.held, "没有待装物品");
    }
    async function arrangeAndApply(candidate, spaceSize) {
      const response = await fetch("/cargo/arrange", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          furniture_items: candidate.map(toApiItem),
          space: spaceSize
        })
      });
      const body = await response.json();
      if (!response.ok) throw new Error(errorText(body));
      furnitureItems = candidate;
      apply(body);
      renderFurnitureList();
    }
    function fill(list, items, empty) {
      list.innerHTML = "";
      if (!items.length) {
        const blank = document.createElement("li");
        blank.textContent = empty;
        list.appendChild(blank);
        return;
      }
      for (const item of items) {
        const row = document.createElement("li");
        row.dataset.id = item.id;
        const place = item.level
          ? `${sideText[item.side] || ""}${levelText[item.level] || ""} · 离地 ${Math.round(item.y_cm)} cm`
          : "尚未放入车厢";
        row.innerHTML = `<strong>${item.name}</strong><small>${place} · ${Math.round(item.width_cm)}×${Math.round(item.height_cm)}×${Math.round(item.depth_cm)} cm</small>`;
        row.addEventListener("click", () => {
          space.select(item.id);
          mark(item.id);
        });
        list.appendChild(row);
      }
    }

    function mark(id) {
      document.querySelectorAll(".items li").forEach((row) => {
        row.classList.toggle("active", row.dataset.id === id);
      });
    }

    async function run(label, action) {
      busy = true;
      document.getElementById("build").disabled = true;
      status.textContent = label;
      try {
        await action();
      } catch (error) {
        status.textContent = error.message || "没有完成这次操作";
      } finally {
        busy = false;
        document.getElementById("build").disabled = false;
      }
    }

    function errorText(body) {
      if (!body) return "没有完成这次操作";
      if (typeof body.detail === "string") return body.detail;
      if (Array.isArray(body.detail)) return body.detail.map((item) => item.msg).join("；");
      return "没有完成这次操作";
    }

    document.getElementById("build").addEventListener("click", build);
    document.getElementById("frame").addEventListener("click", () => space.frame());
    document.getElementById("rotate").addEventListener("click", () => {
      const item = space.selectedItem();
      if (!item) {
        status.textContent = "先选中一件物品。";
        return;
      }
      commit({
        id: item.id,
        x_cm: item.x_cm,
        z_cm: item.z_cm,
        yaw_quarters: ((item.yaw_quarters || 0) + 1) % 4,
        intent: "rotate"
      });
    });
    build();
  </script>
</body>
</html>
